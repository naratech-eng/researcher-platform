# aws-cf/ec2-airflow-stack.yml

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This CloudFormation template deploys a general-purpose EC2 instance running
  Ubuntu 24.04 LTS with Docker and Docker Compose pre-installed. It is intended 
  for hosting various containerized applications like Jenkins, Airflow, etc. 
  Access is secured via SSM Session Manager and HTTPS via CloudFront.

Parameters:
  InstanceType:
    Description: EC2 instance type for the application servers.
    Type: String
    Default: t3.large
    AllowedValues:
      - t2.micro
      - t3.small
      - t3.medium
      - t3.large

  LatestAmiId:
    Type: String
    Default: 'ami-0d1b5a8c13042c939'
    Description: The specific Ubuntu Server 24.04 LTS (Noble) AMI ID for us-east-2.

  ExistingEFSFileSystemId:
    Description: (Optional) ID of an existing EFS file system to reuse. If left blank, a new one is created.
    Type: String
    Default: ""
    
  SSLCertificateArn:
    Type: String
    Description: ARN of the SSL certificate in us-east-1 region (required for CloudFront)
    Default: ""
    
  DomainName:
    Type: String
    Description: Domain name for Airflow and Keycloak access (e.g., etl.naratech.xyz)
    Default: "etl.naratech.xyz"
    
  EnableCloudFront:
    Type: String
    Description: Enable CloudFront distribution for HTTPS access
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  CreateEFS:
    !Equals [!Ref ExistingEFSFileSystemId, ""]
  CreateCloudFront:
    !Equals [!Ref EnableCloudFront, "true"]
  HasCertificate:
    !Not [!Equals [!Ref SSLCertificateArn, ""]]

Resources:
  # --- Networking --- #
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-VPC"

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PublicSubnet"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-IGW"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PublicRouteTable"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --- Static Elastic IP for Persistent Public Address --- #
  StaticElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-Static-EIP"

  # --- Security --- #
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [ec2.amazonaws.com] }
            Action: [ 'sts:AssumeRole' ]
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2InstanceRole]

  # --- EIP Manager Lambda Role --- #
  EIPManagerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-EIPManager-Role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EIPManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - ec2:DescribeAddresses
                  - ec2:ReleaseAddress
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allows inbound web, Airflow, Keycloak, and SSH traffic."
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-EC2-SG"
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8081, ToPort: 8081, CidrIp: 0.0.0.0/0 }

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allows NFS traffic from the EC2 instance security group."
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-EFS-SG"

  # --- Security Group Rules (decoupled to prevent deletion deadlocks) --- #
  AllowAllOutboundEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: -1 # -1 means all protocols
      CidrIp: 0.0.0.0/0

  EC2ToEFSEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !Ref EFSSecurityGroup

  EFSToEC2IngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EFSSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref EC2SecurityGroup

  # --- Persistent Storage (EFS) --- #
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Condition: CreateEFS
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      FileSystemTags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-AirflowData"
        - Key: AirflowCluster
          Value: !Ref AWS::StackName
    DeletionPolicy: Retain # IMPORTANT: This prevents data loss if the stack is deleted

  EFSMountTarget:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !If [CreateEFS, !Ref EFSFileSystem, !Ref ExistingEFSFileSystemId]
      SubnetId: !Ref PublicSubnet
      SecurityGroups: [!Ref EFSSecurityGroup]

  # --- Compute --- #
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        ImageId: !Ref LatestAmiId
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash -xe
                exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

                echo "--- Starting Generic Host UserData Script ---"

                # Install dependencies
                echo "--- Installing Dependencies ---"
                apt-get update
                apt-get install -y build-essential binutils pkg-config libssl-dev libfuse-dev fuse unzip cargo

                echo "--- Installing Docker ---"
                install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                chmod a+r /etc/apt/keyrings/docker.asc
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
                apt-get update
                apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                chmod 666 /var/run/docker.sock

                echo "--- Installing AWS CLI v2 ---"
                curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
                unzip awscliv2.zip
                ./aws/install
                rm -f awscliv2.zip

                echo "--- Installing Amazon EFS Mount Helper ---"
                git clone https://github.com/aws/efs-utils
                cd efs-utils
                ./build-deb.sh
                apt-get -y install ./build/amazon-efs-utils*deb
                cd ..

                echo "--- Mounting EFS Filesystem: ${EfsId} ---"
                EFS_DIR="/mnt/efs/data"
                mkdir -p $EFS_DIR
                mount -t efs -o tls ${EfsId}:/ $EFS_DIR
                echo "${EfsId}:/ $EFS_DIR efs _netdev,tls 0 0" >> /etc/fstab

                echo "--- Creating Keycloak Directory for Data Persistence ---"
                KEYCLOAK_EFS_DIR="/mnt/efs/data/keycloak"
                mkdir -p $KEYCLOAK_EFS_DIR
                chown 1000:1000 $KEYCLOAK_EFS_DIR
                chmod 770 $KEYCLOAK_EFS_DIR

                echo "--- Creating Symlink for Keycloak ---"
                ln -sfn $KEYCLOAK_EFS_DIR /home/ubuntu/keycloak
                chown -R ubuntu:ubuntu /home/ubuntu/keycloak

                echo "--- Creating Airflow Directories for Data Persistence ---"
                AIRFLOW_EFS_DIR="/mnt/efs/data/airflow"
                mkdir -p $AIRFLOW_EFS_DIR/{dags,logs,plugins,config,postgres-db}
                chown -R ubuntu:ubuntu $AIRFLOW_EFS_DIR

                # Set ownership for the PostgreSQL data directory (Postgres container runs as user 999)
                chown -R 999:999 $AIRFLOW_EFS_DIR/postgres-db

                echo "--- Creating Symlink for Easy Access ---"
                ln -sfn $AIRFLOW_EFS_DIR /home/ubuntu/airflow
                chown -R ubuntu:ubuntu /home/ubuntu/airflow

                echo "--- UserData Script Finished Successfully ---"
              - EfsId: !If [CreateEFS, !Ref EFSFileSystem, !Ref ExistingEFSFileSystemId]

  # --- EIP Manager Lambda Function --- #
  EIPManagerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-EIP-DDNS-Handler"
      Runtime: python3.11
      Role: !GetAtt EIPManagerLambdaRole.Arn
      Handler: eip_ddns_lambda.lambda_handler
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"status": "placeholder - deploy with external zip"}
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          ALLOCATION_ID: !GetAtt StaticElasticIP.AllocationId
          ASG_NAME: !Ref AutoScalingGroup
          STACK_NAME: !Ref AWS::StackName

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: '1'
        MinInstancesInService: '0'
        PauseTime: 'PT2M' # Give instance 2 minutes to boot before stack update is marked complete
    Properties:
      VPCZoneIdentifier: [!Ref PublicSubnet]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '0'
      MaxSize: '2'
      DesiredCapacity: '1'
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-Instance"
          PropagateAtLaunch: true

  # --- CloudWatch Events for EIP Management --- #
  ASGLaunchEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-EC2-Launch-Event"
      Description: "Triggers Lambda when an EC2 instance enters the running state"
      EventPattern:
        source:
          - "aws.ec2"
        detail-type:
          - "EC2 Instance State-change Notification"
        detail:
          state:
            - "running"
      State: ENABLED
      Targets:
        - Arn: !GetAtt EIPManagerLambdaFunction.Arn
          Id: "EIPManagerLaunchTarget"

  ASGTerminateEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-EC2-Terminate-Event"
      Description: "Triggers Lambda when an EC2 instance is terminated"
      EventPattern:
        source:
          - "aws.ec2"
        detail-type:
          - "EC2 Instance State-change Notification"
        detail:
          state:
            - "terminated"
      State: ENABLED
      Targets:
        - Arn: !GetAtt EIPManagerLambdaFunction.Arn
          Id: "EIPManagerTerminateTarget"

  LambdaInvokePermissionLaunch:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EIPManagerLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ASGLaunchEventRule.Arn

  LambdaInvokePermissionTerminate:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EIPManagerLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ASGTerminateEventRule.Arn
      
  # --- CloudFront Distribution for HTTPS Access --- #
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFront
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: AirflowOrigin
            DomainName: etl-backend.naratech.xyz
            CustomOriginConfig:
              HTTPPort: 8080
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
          - Id: KeycloakOrigin
            DomainName: etl-backend.naratech.xyz
            CustomOriginConfig:
              HTTPPort: 8081
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        # CloudFront DistributionConfig (latest AWS best practices)
        DefaultCacheBehavior:
          TargetOriginId: AirflowOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            Headers:
              - Host
              - Origin
              - Authorization
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 0
        CacheBehaviors:
          - PathPattern: "/airflow/*"
            TargetOriginId: AirflowOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Host
                - Origin
                - Authorization
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
          - PathPattern: "/keycloak/*"
            TargetOriginId: KeycloakOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Host
                - Origin
                - Authorization
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
        Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          !If 
            - HasCertificate
            - AcmCertificateArn: !Ref SSLCertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - CloudFrontDefaultCertificate: true

Outputs:
  VPCId:
    Description: ID of the newly created VPC.
    Value: !Ref VPC
  PublicSubnetId:
    Description: ID of the newly created public subnet.
    Value: !Ref PublicSubnet
  EFSFileSystemId:
    Description: ID of the EFS file system. Use this for the 'ExistingEFSFileSystemId' parameter on subsequent deployments to reuse the same EFS.
    Value: !If [CreateEFS, !Ref EFSFileSystem, !Ref ExistingEFSFileSystemId]
  AutoScalingGroupName:
    Description: Name of the Auto Scaling Group.
    Value: !Ref AutoScalingGroup

  EIPAllocationId:
    Description: Allocation ID of the static Elastic IP.
    Value: !GetAtt StaticElasticIP.AllocationId

  StaticElasticIP:
    Description: The persistent static IP address for Airflow and Keycloak services.
    Value: !Ref StaticElasticIP
  AirflowURL:
    Description: Airflow Web UI URL (persistent)
    Value: !Sub "http://${StaticElasticIP}:8080/"
  KeycloakURL:
    Description: Keycloak Web UI URL (persistent)
    Value: !Sub "http://${StaticElasticIP}:8081/"
  LambdaFunctionName:
    Description: Name of the EIP Manager Lambda function for code deployment.
    Value: !Ref EIPManagerLambdaFunction
  
  CloudFrontDomainName:
    Condition: CreateCloudFront
    Description: Domain name of the CloudFront distribution
    Value: !GetAtt CloudFrontDistribution.DomainName
  
  SecureAirflowURL:
    Condition: CreateCloudFront
    Description: Secure Airflow Web UI URL via CloudFront
    Value: !Sub "https://${DomainName}/airflow/"
  
  SecureKeycloakURL:
    Condition: CreateCloudFront
    Description: Secure Keycloak Web UI URL via CloudFront
    Value: !Sub "https://${DomainName}/keycloak/"
