name: user-api
type: Load Balanced Web Service
platform: linux/arm64

image:
  build:
    dockerfile: user-backend/Dockerfile
    context: user-backend
  port: 3000

http:
  path: '/'
  alias: 'user-api.naratech.ca'
  healthcheck:
    path: '/health'
    healthy_threshold: 2
    unhealthy_threshold: 2
    interval: 10s
    timeout: 5s

cpu: 256
memory: 512
count: 1

network:
  vpc:
    placement: 'public'

variables:
  DB_NAME: animal_genetics
  AWS_REGION: us-east-2
  PORT: 3000
  CORS_ALLOWED_ORIGINS: "https://dev-platform.naratech.ca,https://platform.naratech.ca"
  DOCUMENTDB_TLS: "true"
  DOCUMENTDB_CA_FILE: /etc/ssl/certs/rds-global-bundle.pem
  DOCUMENTDB_PORT: 27017
  DOCUMENTDB_ENDPOINT: user-data-docdb-elastic-091957636975.us-east-2.docdb-elastic.amazonaws.com
  DOCUMENTDB_USERNAME: docdbadmin
  DOCDB_ELASTIC_ADMIN_SECRET_ARN: arn:aws:secretsmanager:us-east-2:091957636975:secret:genetics-docdb-elastic-DocDBElasticAdminPassword-e0Khu1

secrets:
  JWT_SECRET: JWT_SECRET
  DOCUMENTDB_URI: DOCUMENTDB_URI

environments:
  dev:
    secrets:
      JWT_SECRET: /copilot/naratech/dev/secrets/JWT_SECRET
      DOCUMENTDB_URI: /copilot/naratech/dev/secrets/DOCUMENTDB_URI
    count: 1
  prod:
    secrets:
      JWT_SECRET: /copilot/naratech/prod/secrets/JWT_SECRET
      DOCUMENTDB_URI: /copilot/naratech/prod/secrets/DOCUMENTDB_URI
    count: 2
    cpu: 512
    memory: 1024
    http:
      healthcheck:
        healthy_threshold: 3
        unhealthy_threshold: 2
        interval: 15s
        timeout: 10s
