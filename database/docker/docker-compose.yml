services:
  mysql:
    image: mysql:latest   # LTS for stability
    container_name: mysql_container
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # passwords from secrets files
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
      # non-secret values (can come from .env)
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    # auto-import any .sql/.sql.gz in this folder on first boot
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$(cat /run/secrets/mysql_root_password) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    secrets:
      - mysql_root_password
      - mysql_user_password

volumes:
  mysql_data: {}  # new volume will be created

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_user_password:
    file: ./secrets/mysql_user_password