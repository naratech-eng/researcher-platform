name: Deploy user-backend (Copilot)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  APP_NAME: naratech
  SERVICE_NAME: user-api

concurrency:
  group: user-backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment (dev on branch 'dev', prod on 'naratech')
        run: |
          if [[ "${GITHUB_REF_NAME}" == "naratech" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
          fi
          echo "Deploying to $ENV_NAME"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS Copilot CLI
        run: |
          curl -Lo copilot https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux-amd64
          sudo install -m 755 copilot /usr/local/bin/copilot
          copilot --version

      - name: Deploy service with Copilot
        run: |
          copilot deploy \
            --app "$APP_NAME" \
            --name "$SERVICE_NAME" \
            --env "$ENV_NAME" \
            --force
