name: Supabase DB Push

on:
  push:
    branches:
      - dev
    paths:
      - frontend/supabase/migrations/**
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: gvytapsyqmwbabixwnmq
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Show Supabase CLI version
        run: npx -y supabase@latest --version

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing secret: SUPABASE_DB_PASSWORD" && exit 1)

      - name: Link project
        run: npx -y supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview migrations (dry run)
        run: npx -y supabase@latest db push --dry-run

      - name: Push migrations
        run: npx -y supabase@latest db push
